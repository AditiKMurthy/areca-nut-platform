<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inside frontend/index.html <head> -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#047857" />
    <script>
      // Automatically clear old broken service workers for existing users on load
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let registration of registrations) {
              // If there's an update or we need to clear stale caches, unregister
              registration.unregister().then(function (boolean) {
                if (boolean) {
                  console.log("Stale service worker cleared, reloading...");
                  window.location.reload();
                }
              });
            }
          });
      }
    </script>
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
